
name: Actualizar publicaciones de NEXATA

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio SLUPMX
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Actualizar publicaciones desde NEXATA
        run: python scripts/update_nexata_feed.py

      - name: Guardar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nexata-products.json
          git diff --cached --quiet || git commit -m "Actualizar publicaciones de NEXATA"
          git push
